<!doctype html>
<!--
  ============================================================================
  SmartSacak — Online Market (tek dosya / single file)
  ============================================================================
  Veritabanı YOK. Her şey bu dosyanın içinde.  |  No database. All in this file.

  1) TELEFON NUMARASI  →  aşağıdaki CONFIG.phone alanına yaz.
     Sipariş, telefonun MESAJ (SMS) uygulaması ile bu numaraya gönderilir.
     PHONE NUMBER      →  set CONFIG.phone below; ordering opens the phone's
     own messages app with the order ready to send to that number.

  2) ÜRÜN EKLEMEK      →  MENU listesinde her ürün TEK bir kayıt (tek div/kart):
     ADD A PRODUCT     →  one entry per product inside MENU:

        { id: "p1", name: { ru:"Имя", tk:"Ady" },
          price: 12.5, image: "burger-burger1.webp" }

  3) RESİMLER          →  "uploads/" klasörüne koy, sadece dosya adını yaz.
     IMAGES            →  drop the file into uploads/, reference the file name.

  4) BANNER            →  BANNERS listesi. Kendiliğinden kayar, parmakla da
                          sürüklenebilir. / auto-scrolls, also swipeable.

  Parallax logo, dil değiştirici, koyu/açık tema ve ürün büyük resim penceresi
  hazırdır. PDF yoktur.
  ============================================================================
-->
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f97316" />
    <title>Turkana Restoran</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>"
    />

    <!-- Açılış ekranı / boot screen. Sayfa JS ile çizildiği için, dosyanın geri
         kalanı inerken ekran boş kalmasın diye burada — en üstte — duruyor.
         The page is drawn by JS, so this sits first in the file: it paints while
         the rest of the document is still downloading. Keep it tiny. -->
    <script>
      // Tema hemen uygulanır, yoksa açılışta koyu/açık zıplaması olur.
      // Apply the theme up front, otherwise the boot screen flashes.
      // Dikkat: IIFE şart — buradaki değişkenler global olursa aşağıdaki
      // uygulama betiğiyle çakışır. / Must stay an IIFE: globals declared here
      // would collide with the app script below.
      (function () {
        // Aşamalı açılış işareti. JS çalışmazsa bu sınıf hiç eklenmez ve
        // içerik gizlenmeden görünür. / Marks staged boot: with JS off the
        // class never lands and nothing is ever hidden.
        document.documentElement.classList.add("staged");
        try {
          var saved = localStorage.getItem("sm.market.theme");
          document.documentElement.dataset.theme = saved
            ? JSON.parse(saved)
            : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fafafa;
        color: #6b7280;
        font:
          500 15px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      html[data-theme="dark"] #boot {
        background: #0a1018;
        color: #8b95a5;
      }
      #boot .mark {
        font-size: 44px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot .bar {
        width: 132px;
        height: 3px;
        border-radius: 99px;
        background: currentColor;
        opacity: 0.18;
        overflow: hidden;
      }
      #boot .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: #54bb1d;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.88);
          opacity: 0.55;
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      /* Uygulama çizilince kaybolur / removed once the app has rendered. */
      html.ready #boot {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark,
        #boot .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">🛒</div>
      <div class="bar" aria-hidden="true"></div>
    </div>

    <header class="topbar" data-reveal="head">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-text">
            <div class="brand-name" id="brandName">
              Turkana Restoran Nebitdag
            </div>
            <div class="brand-sub" data-i18n="tagline"></div>
          </div>
        </div>

        <button id="topOrder" type="button"></button>

        <div class="lang">
          <button
            class="icon-btn lang-btn"
            id="langBtn"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <span class="flag" id="langFlag">🇷🇺</span>
            <span class="code" id="langCode">RU</span>
          </button>
          <div class="lang-menu" id="langMenu" role="menu"></div>
        </div>

        <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme">
          <svg
            id="iconMoon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg
            id="iconSun"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="display: none"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- Parallax hero: logo + welcome drift down as you scroll, plates trail behind -->
    <section class="hero" id="hero" data-reveal="head">
      <div class="hero-decor" id="heroDecor">
        <img class="left" id="heroLeft" src="" alt="" />
        <img class="right" id="heroRight" src="" alt="" />
      </div>
      <div class="hero-content" id="heroContent">
        <img class="hero-logo" id="heroLogo" src="" alt="" />
        <span class="hero-welcome" data-i18n="welcome"></span>
      </div>
    </section>

    <!-- Auto-scrolling, swipeable banner -->
    <div class="banner-wrap" id="bannerWrap" data-reveal="banner">
      <div class="banner">
        <div class="banner-track" id="bannerTrack"></div>
        <div class="dots" id="bannerDots"></div>
      </div>
    </div>

    <nav class="catrail" aria-label="Categories" data-reveal="menu">
      <div class="catrail-inner" id="catrail"></div>
    </nav>

    <main id="content" data-reveal="menu"></main>

    <!-- Sayfa altı. Ziyaretçi sayacı sunucusuz çalışır: sayı ücretsiz bir
         sayaç servisinden gelir, gelmezse satır kendini gizler.
         Page footer. The visit counter needs no backend: the number comes from
         a free counter service, and the row hides itself if that call fails. -->
    <footer class="sitefoot" data-reveal="rest">
      <div class="foot-brand" id="footBrand">Turkana Restoran Nebitdag</div>
      <div class="visits" id="visits" hidden>
        <span class="visits-eye" aria-hidden="true">👁</span>
        <span class="visits-num" id="visitsNum">—</span>
      </div>
    </footer>

    <!-- Sağ altta duran sepet yuvarlağı: halka, altında etiket.
         The cart circle sitting bottom-right: a ring with its caption below. -->
    <button class="fab" id="fab" type="button" aria-label="Cart" data-reveal="rest">
      <span class="fab-ring">
        <svg
          width="25"
          height="25"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="20" r="1.6" />
          <circle cx="18" cy="20" r="1.6" />
          <path d="M2 3h2.2l2.6 12.2h11.4l2.2-8.4H6" />
        </svg>
        <span class="fab-badge" id="fabBadge">0</span>
      </span>
      <span class="fab-cap" data-i18n="cartShort"></span>
    </button>

    <div class="backdrop" id="backdrop"></div>

    <aside
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetTitle"
    >
      <div class="sheet-head">
        <h2 id="sheetTitle" data-i18n="cart"></h2>
        <span class="total-mini" id="sheetCount"></span>
        <button
          class="icon-btn"
          id="sheetClose"
          type="button"
          aria-label="Close"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="sheet-body" id="sheetBody"></div>

      <div class="sheet-foot">
        <div class="totals sub">
          <span class="t-label" data-i18n="delivery"></span>
          <span class="t-value" id="deliveryValue">0</span>
        </div>
        <div class="totals">
          <span class="t-label" data-i18n="total"></span>
          <span class="t-value" id="totalValue">0</span>
        </div>
        <div class="cta-row">
          <button class="cta" id="orderBtn" type="button">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
              />
            </svg>
            <span data-i18n="sendOrder"></span>
          </button>
          <a class="cta call" id="callBtn" href="#">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"
              />
            </svg>
          </a>
        </div>
        <button
          class="ghost"
          id="clearBtn"
          type="button"
          data-i18n="clear"
        ></button>
      </div>
    </aside>

    <!-- Big picture popup for a single product -->
    <div class="pop-back" id="popBack"></div>
    <div
      class="pop"
      id="pop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="popTitle"
    >
      <div class="pop-card" id="popCard">
        <button
          class="pop-close"
          id="popClose"
          type="button"
          aria-label="Close"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>

        <div class="pop-img" id="popImgWrap">
          <span class="ph" aria-hidden="true">🍽️</span>
          <img id="popImg" src="" alt="" />
          <div class="veil"></div>
          <span class="pop-price-pill" id="popPricePill"></span>
        </div>

        <div class="pop-body">
          <span class="pop-badge" id="popBadge"></span>
          <h2 class="pop-title" id="popTitle"></h2>
          <span class="pop-price-big" id="popPriceBig"></span>

          <div class="pop-actions">
            <button class="cta" id="popCta" type="button"></button>

            <div class="pop-stepper" id="popStepper">
              <button type="button" id="popDec" aria-label="-">
                <svg
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                  stroke-linecap="round"
                >
                  <path d="M5 12h14" />
                </svg>
              </button>
              <span class="q" id="popQty">0</span>
              <button type="button" id="popInc" aria-label="+">
                <svg
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.6"
                  stroke-linecap="round"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- Ana stil dosyası burada; <head> içindeyken sayfanın boyanmasını
         geciktiriyordu. Yukarıdaki açılış ekranı zaten her şeyi örtüyor.
         The main stylesheet is linked here, not in <head>: up there it
         blocked first paint. The boot screen above already covers the page. -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Önce veriler, sonra uygulama: app.js data.js'teki CONFIG, BANNERS,
         LANGS, T ve MENU'yü kullanır, o yüzden sıra değişmemeli.
         Data first, app second: app.js reads CONFIG, BANNERS, LANGS, T and
         MENU from data.js, so this order matters. -->
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
